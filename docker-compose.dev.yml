# Local SQL Server for development outside cloud sessions (production runs on SQL Server too):
#   docker compose -f docker-compose.dev.yml up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Storefront_dev1
    ports:
      - "1433:1433"
    volumes:
      - storefront-sql:/var/opt/mssql
volumes:
  storefront-sql:
